name: harness-experiments

services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/harness-experiments:cached
    command: sleep infinity
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:-changeme}
    depends_on:
      elasticsearch:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    environment:
      discovery.type: single-node
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-changeme}
      # Local-only experiments: keep authentication, skip TLS on HTTP
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      xpack.license.self_generated.type: basic
      ES_JAVA_OPTS: -Xms2g -Xmx2g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      # Bound to localhost only: sample content must not be reachable from the network
      - "127.0.0.1:9200:9200"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -s -u "elastic:$${ELASTIC_PASSWORD}" http://localhost:9200/_cluster/health | grep -qE '"status":"(green|yellow)"'
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  esdata:
